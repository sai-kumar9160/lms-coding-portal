services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms_local
      POSTGRES_DB: lms
    ports:
      - "5432:5432"
    volumes:
      - lms_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms"]
      interval: 5s
      retries: 10
volumes:
  lms_postgres:
